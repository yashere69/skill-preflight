name: skill-preflight
description: Check Agent Skills for spec conformance and diff them against skills.lock
inputs:
  path:
    description: Folder containing skills
    default: skills
  lockfile:
    description: Lockfile to diff against (skipped if it does not exist)
    default: skills.lock
runs:
  using: composite
  steps:
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: skill-preflight check "${{ inputs.path }}"
    - shell: bash
      run: |
        if [ -f "${{ inputs.lockfile }}" ]; then
          skill-preflight diff "${{ inputs.path }}" --lockfile "${{ inputs.lockfile }}"
        fi
